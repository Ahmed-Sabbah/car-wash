<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Wash</title>
    <link rel="stylesheet" href="css/add-review.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <header>
        <div class="left-navbar">
            <img class="logo" src="images/landpage/Logo.svg" alt="logo">
            <ul class="nav-links">
                <li class="nav-item"><a href="#">Dashboard</a></li>
                <li class="nav-item"><a href="#">Settings</a></li>
            </ul>
        </div>
        <div class="right-navbar">
            <div class="auth-user">
                <div class="notification-icon">
                    <img src="images/icons/bell.svg" alt="bell">
                </div>
                <h4>Hello John</h4>
                <div class="user-image">
                    <!-- <img src="" alt=""> -->
                </div>
            </div>
            <!-- <button class="login-link"><a href="#">Login</a></button>
            <button class="get-started-link"><a href="#">Get Started</a></button> -->
            <button class="choose-localization"><img src="images/icons/british flag.svg" alt="lang"></button>
        </div>
    </header>

    <div class="mobile-menu">
        <div class="head">
            <div class="content">
                <img class="logo" src="images/landpage/Logo.svg" alt="logo">
                <button class="menu-toggle-btn" id="show-menu-btn" onclick="showMenu()">
                    <img src="images/landpage/menu.svg" alt="menu">
                </button>
                <button class="menu-toggle-btn" id="close-menu-btn" onclick="closeMenu()">
                    <img src="images/landpage/x.svg" alt="x">
                </button>
            </div>
        </div>
        <div class="menu">
            <div class="content">
                <ul class="nav-links">
                    <li class="nav-item"><a href="#">Dashboard</a></li>
                    <li class="nav-item active"><a href="#">Settings</a></li>
                </ul>
                <div class="auth-user">
                    <div class="notification-icon" id="showNotification">
                        <img src="images/icons/bell.svg" alt="bell">
                    </div>
                    <div class="user-info">
                        <h4>Hello John</h4>
                        <div class="user-image">
                            <!-- <img src="" alt=""> -->
                        </div>
                    </div>
                    <button class="choose-localization"><img src="images/icons/british flag.svg" alt="lang"></button>
                </div>
            </div>
        </div>
    </div>

            <form>
                <div class="input-group">
                    <label>Leave a review</label>
                    <textarea></textarea>
                </div>

            </form>

    <script src="js/jquery-3.5.1.min.js"></script>
    <script>
        function showMenu(e) {
            $('.mobile-menu .head .menu-toggle-btn#show-menu-btn').toggle();
            $('.mobile-menu .head .menu-toggle-btn#close-menu-btn').toggle();
            $('.mobile-menu .menu').toggle();
        }

        function closeMenu(e) {
            $('.mobile-menu .head .menu-toggle-btn#show-menu-btn').toggle();
            $('.mobile-menu .head .menu-toggle-btn#close-menu-btn').toggle();
            $('.mobile-menu .menu').toggle();
        }

        function getRating(star) {
            console.log(star);
            $('.stars .item').removeClass('selected');
            for (let index = 1; index <= star; index++) {
                $('.stars #star' + index + " svg path").css('fill', '#45e01f');
            }
            for (let index = star+1; index < 6; index++) {
                $('.stars #star' + index + " svg path").css('fill', 'none');
            }
            $('.stars #star' + star).addClass('selected');
        }
    </script>
</body>

</html>
