<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Wash</title>
    <link rel="stylesheet" href="css/complete-profile.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <header>
        <div class="left-navbar">
            <img class="logo" src="images/landpage/Logo.svg" alt="logo">
            <ul class="nav-links">
                <li class="nav-item"><a href="#">Dashboard</a></li>
                <li class="nav-item"><a href="#">Settings</a></li>
            </ul>
        </div>
        <div class="right-navbar">
            <div class="auth-user">
                <div class="notification-icon">
                    <img src="images/icons/bell.svg" alt="bell">
                </div>
                <h4>Hello John</h4>
                <div class="user-image">
                    <!-- <img src="" alt=""> -->
                </div>
            </div>
            <!-- <button class="login-link"><a href="#">Login</a></button>
            <button class="get-started-link"><a href="#">Get Started</a></button> -->
            <button class="choose-localization"><img src="images/icons/british flag.svg" alt="lang"></button>
        </div>
    </header>

    <div class="mobile-menu">
        <div class="head">
            <div class="content">
                <img class="logo" src="images/landpage/Logo.svg" alt="logo">
                <button class="menu-toggle-btn" id="show-menu-btn" onclick="showMenu()">
                    <img src="images/landpage/menu.svg" alt="menu">
                </button>
                <button class="menu-toggle-btn" id="close-menu-btn" onclick="closeMenu()">
                    <img src="images/landpage/x.svg" alt="x">
                </button>
            </div>
        </div>
        <div class="menu">
            <div class="content">
                <ul class="nav-links">
                    <li class="nav-item active"><a href="#">Dashboard</a></li>
                    <li class="nav-item"><a href="#">Settings</a></li>
                </ul>
                <div class="auth-user">
                    <div class="notification-icon" id="showNotification">
                        <img src="images/icons/bell.svg" alt="bell">
                    </div>
                    <div class="user-info">
                        <h4>Hello John</h4>
                        <div class="user-image">
                            <!-- <img src="" alt=""> -->
                        </div>
                    </div>
                    <button class="choose-localization"><img src="images/icons/british flag.svg" alt="lang"></button>
                </div>
            </div>
        </div>
    </div>

    <form>
        <div class="complete-profile" id="step1">
            <div class="step">
                <div class="title">
                    <h2>Profile</h2>
                </div>
                <div class="btn-group">
                    <button>Save Changes</button>
                </div>
            </div>
            <div class="profile-details">
                <div class="details">
                    <div class="user-details">
                        <h3>User Details</h3>
                        <div class="form-group">
                            <div class="input-group">
                                <label>User Name</label>
                                <input type="text">
                            </div>
                            <div class="input-group">
                                <label>Email</label>
                                <input type="email">
                            </div>
                            <div class="input-group">
                                <label>Mobile Number</label>
                                <input type="tel">
                            </div>
                            <div class="input-group">
                                <label>Compound Name</label>
                                <input type="text">
                            </div>
                            <div class="input-group">
                                <label>Compound Address</label>
                                <input type="text">
                            </div>
                        </div>
                    </div>
                    <div class="parking-details">
                        <h3>Parking Details</h3>
                        <div class="form-group">
                            <div class="input-group">
                                <label>Car Parking Slot Number</label>
                                <input type="text">
                            </div>
                            <div class="input-group">
                                <div class="leaving-time">
                                    <p>DO You Leave The Parking Before 6:00 Am ?</p>
                                    <span onclick="hideLeavingTime()">Yes</span>
                                </div>
                                <div class="leaving">
                                    <label class="container">
                                        <input type="radio" onchange="showLeavingTime()" name="leave_parking">
                                        <span class="checkmark"></span>
                                        Yes
                                    </label>
                                    <label class="container">
                                        <input type="radio" name="leave_parking">
                                        <span class="checkmark"></span>
                                        No
                                    </label>
                                </div>
                                <div class="show-leaving-time">
                                    <input type="text" placeholder="The hour you are leaving at">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="profile-image">
                    <h3>Profile Image</h3>
                    <div class="upload-image">
                        <div class="image">
                        </div>
                        <p>Click to upload</p>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <script src="js/jquery-3.5.1.min.js"></script>
    <script>
        function moveStep2() {
            $('#step1').css('display', 'none');
            $('#step2').css('display', 'block');
        }
        function showLeavingTime() {
            $('.complete-profile#step1 .profile-details .parking-details .leaving').css('display', 'none');
            $('.complete-profile#step1 .profile-details .parking-details .leaving-time span').css('display', 'inline-block');
            $('.complete-profile#step1 .profile-details .parking-details .show-leaving-time').css('display', 'block');
        }
        function hideLeavingTime() {
            $('.complete-profile#step1 .profile-details .parking-details .leaving').css('display', 'flex');
            $('.complete-profile#step1 .profile-details .parking-details .leaving-time span').css('display', 'none');
            $('.complete-profile#step1 .profile-details .parking-details .show-leaving-time').css('display', 'none');
        }

        function showMenu(e) {
            $('.mobile-menu .head .menu-toggle-btn#show-menu-btn').toggle();
            $('.mobile-menu .head .menu-toggle-btn#close-menu-btn').toggle();
            $('.mobile-menu .menu').toggle();
        }

        function closeMenu(e) {
            $('.mobile-menu .head .menu-toggle-btn#show-menu-btn').toggle();
            $('.mobile-menu .head .menu-toggle-btn#close-menu-btn').toggle();
            $('.mobile-menu .menu').toggle();
        }
    </script>
</body>

</html>
