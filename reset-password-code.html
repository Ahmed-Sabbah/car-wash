<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Wash</title>
    <link rel="stylesheet" href="css/authentication.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <header>
        <div class="left-navbar">
            <img class="logo" src="images/landpage/Logo.svg" alt="logo">
            <ul class="nav-links">
                <li class="nav-item"><a href="#">How it works</a></li>
                <li class="nav-item"><a href="#">Pricing</a></li>
            </ul>
        </div>
        <div class="right-navbar">
            <button class="login-link"><a href="#">Login</a></button>
            <button class="get-started-link"><a href="#">Get Started</a></button>
            <button class="choose-localization"><img src="images/icons/british flag.svg" alt="lang"></button>
        </div>
    </header>
    
    <div class="mobile-menu">
        <div class="head">
            <div class="content">
                <img class="logo" src="images/landpage/Logo.svg" alt="logo">
                <button class="menu-toggle-btn" id="show-menu-btn" onclick="showMenu()">
                    <img src="images/landpage/menu.svg" alt="menu">
                </button>
                <button class="menu-toggle-btn" id="close-menu-btn" onclick="closeMenu()">
                    <img src="images/landpage/x.svg" alt="x">
                </button>
            </div>
        </div>
        <div class="menu">
            <div class="content">
                <ul class="nav-links">
                    <li class="nav-item"><a href="#">How it works</a></li>
                    <li class="nav-item"><a href="#">Pricing</a></li>
                </ul>
                <button class="login-link"><a href="#">Login</a></button>
                <button class="get-started-link"><a href="#">Get Started</a></button>
                <button class="choose-localization"><img src="images/icons/british flag.svg" alt="lang"></button>
            </div>
        </div>
    </div>

    <section class="authentication">
        <div class="authentication-cover">
            <img src="images/dashboard/auth-cover.png" alt="auth-cover">
        </div>
        <div class="reset-password-code-form">
            <h2 class="title">Reset password</h2>
            <p class="verification-msg">
                A code has been sent to abcd@gmail.com. Please enter the code to reset your password
            </p>
            <form>
                <div class="code-inputs">
                    <input type="text">
                    <input type="text">
                    <input type="text">
                    <input type="text">
                    <input type="text">
                </div>
                <button>Confirm</button>
                <p class="resend-code">Didn’t receive a code ? <a href="#">Resend code</a></p>

            </form>
        </div>
    </section>

    <script src="js/jquery-3.5.1.min.js"></script>
    <script>
        const inputElements = [...document.querySelectorAll('.code-inputs input')]

        inputElements.forEach((ele, index) => {
            ele.addEventListener('keydown', (e) => {
                // if the keycode is backspace & the current field is empty
                // focus the input before the current. Then the event happens
                // which will clear the "before" input box.
                if (e.keyCode === 8 && e.target.value === '') inputElements[Math.max(0, index - 1)].focus()
            })
            ele.addEventListener('input', (e) => {
                // take the first character of the input
                // this actually breaks if you input an emoji like 👨‍👩‍👧‍👦....
                // but I'm willing to overlook insane security code practices.
                const [first, ...rest] = e.target.value
                e.target.value = first ?? '' // first will be undefined when backspace was entered, so set the input to ""
                const lastInputBox = index === inputElements.length - 1
                const insertedContent = first !== undefined
                if (insertedContent && !lastInputBox) {
                    // continue to input the rest of the string
                    inputElements[index + 1].focus()
                    inputElements[index + 1].value = rest.join('')
                    inputElements[index + 1].dispatchEvent(new Event('input'))
                }
            })
        })

        // mini example on how to pull the data on submit of the form
        // function onSubmit(e) {
        //     e.preventDefault()
        //     const code = [...document.getElementsByTagName('input')]
        //         .filter(({ name }) => name)
        //         .map(({ value }) => value)
        //         .join('')
        //     console.log(code)
        // }
        function showMenu(e) {
            $('.mobile-menu .head .menu-toggle-btn#show-menu-btn').toggle();
            $('.mobile-menu .head .menu-toggle-btn#close-menu-btn').toggle();
            $('.mobile-menu .menu').toggle();
        }

        function closeMenu(e) {
            $('.mobile-menu .head .menu-toggle-btn#show-menu-btn').toggle();
            $('.mobile-menu .head .menu-toggle-btn#close-menu-btn').toggle();
            $('.mobile-menu .menu').toggle();
        }
    </script>
</body>

</html>
